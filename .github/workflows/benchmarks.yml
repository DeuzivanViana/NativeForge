name: Benchmarks

# Tracks performance over time; never blocks a pull request. Results go to each run's summary.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-planning:
    name: Build planning (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Plans a 600-file project from scratch and when it is up to date (see BuildPlanBenchmark).
      - name: Run
        env:
          NF_BENCHMARK: "1"
        run: ./gradlew :core:build:test --tests '*BuildPlanBenchmark*' --rerun --stacktrace
      - name: Summary
        run: |
          echo "### Build planning" >> "$GITHUB_STEP_SUMMARY"
          cat core/build/build/benchmark/build-plan.txt >> "$GITHUB_STEP_SUMMARY"

  startup:
    name: APK size and cold start (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_LEVEL: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      # A throwaway key: the APK only has to install on the emulator.
      - name: Sign with a benchmark key
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore "$RUNNER_TEMP/bench.jks" -storepass benchmark -keypass benchmark \
            -alias bench -keyalg RSA -keysize 2048 -validity 2 -dname CN=benchmark
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/bench.jks" --ks-pass pass:benchmark \
            --out "$RUNNER_TEMP/bench.apk" "$(ls app/build/outputs/apk/release/*.apk | head -1)"

      - name: APK size
        run: |
          apk="$RUNNER_TEMP/bench.apk"
          dex=$(unzip -l "$apk" | awk '$4 ~ /^classes[0-9]*\.dex$/ { s += $1 } END { print s + 0 }')
          {
            echo "### APK size"
            echo ""
            echo "APK: $(stat -c %s "$apk") bytes, dex: $dex bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cold start
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: .github/scripts/startup-benchmark.sh "$RUNNER_TEMP/bench.apk" 7

name: Release

# On a version tag (v1.2.3), pushed with git or created with a release on
# github.com: rebuilds the bundled libraries from source, runs the
# tests, builds the release APK, signs it when the signing secrets are set, and
# publishes a GitHub release with the APK and its SHA-256.
#
# Signing secrets (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64   base64 of the keystore file (base64 -w0 release.jks)
#   RELEASE_KEYSTORE_PASSWORD keystore password
#   RELEASE_KEY_ALIAS         key alias
#   RELEASE_KEY_PASSWORD      key password (often the same as the keystore password)
# Without them the release gets an unsigned APK.
#
# To rebuild an existing release (for example after adding the secrets): Actions >
# Release > Run workflow from main, with the tag (v1.2.3) as input. The source of
# that tag is built with this version of the workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish again (for example v0.7.2); empty builds without publishing"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  libs:
    uses: ./.github/workflows/libs-from-source.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  apk:
    needs: libs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the libraries built from source
        run: rm -rf app/src/main/assets/packages

      - uses: actions/download-artifact@v4
        with:
          name: android-libs
          path: app/src/main/assets/packages

      - name: Tests and release APK
        run: ./gradlew test :app:assembleRelease --stacktrace

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          unsigned=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p dist
          if [ -n "$KEYSTORE_BASE64" ]; then
            tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            # Copying the secret from a phone or an editor can add line breaks or spaces.
            if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/release.keystore" 2>/dev/null; then
              echo "::error::RELEASE_KEYSTORE_BASE64 is not valid base64. Paste the whole content of the .jks.base64 file (one long line, about 5,700 characters for a 4096-bit key)."
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null 2>&1; then
              echo "::error::The keystore opened from RELEASE_KEYSTORE_BASE64 does not accept RELEASE_KEYSTORE_PASSWORD, or has no key named RELEASE_KEY_ALIAS."
              exit 1
            fi
            "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --out "dist/NativeForge-$version.apk" "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" verify --print-certs "dist/NativeForge-$version.apk" | grep SHA-256 >> "$GITHUB_STEP_SUMMARY"
            rm "$RUNNER_TEMP/release.keystore"
          else
            cp "$unsigned" "dist/NativeForge-$version-unsigned.apk"
            echo "No signing secrets: the release has an unsigned APK." >> "$GITHUB_STEP_SUMMARY"
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/

      - name: Publish the GitHub release
        if: startsWith(env.TAG, 'v') && (inputs.tag != '' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$TAG
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          notes=fastlane/metadata/android/en-US/changelogs/$code.txt
          [ -f "$notes" ] || notes=/dev/null
          # The tag may come from a release created on github.com: add the files to it.
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "NativeForge ${tag#v}" --notes-file "$notes"
          fi

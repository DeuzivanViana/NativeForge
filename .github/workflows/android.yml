name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: these jobs only build and upload artifacts.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Every exported app carries the runtime template: keep it shrunk and free of IDE files.
      - name: Check the runtime template size
        run: |
          apk=$(ls runtime-template/build/outputs/apk/release/*.apk)
          unzip -l "$apk"
          dex=$(unzip -l "$apk" | awk '$4 ~ /^classes[0-9]*\.dex$/ { s += $1 } END { print s + 0 }')
          echo "Template dex: $dex bytes"
          test "$dex" -lt 4000000
          if unzip -Z1 "$apk" | grep -E '^(io/|kotlin/|DebugProbesKt\.bin|kotlin-tooling-metadata\.json)'; then
            echo "IDE-only files in the runtime template"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nativeforge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

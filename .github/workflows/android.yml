name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: these jobs only build and upload artifacts.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      # The remote web IDE's browser libraries are copied from npm: prove they match the pinned tarballs.
      - name: Check vendored web libraries
        run: core/remote/web/vendor.sh --check

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      # The bundled libraries and their index must reach the APK intact (see the script).
      - name: Check the bundled packages in the APK
        run: python3 .github/scripts/check-apk-packages.py "$(ls app/build/outputs/apk/release/*.apk | head -1)"

      # Every exported app carries the runtime template: keep it shrunk and free of IDE files.
      - name: Check the runtime template size
        run: |
          apk=$(ls runtime-template/build/outputs/apk/release/*.apk)
          unzip -l "$apk"
          dex=$(unzip -l "$apk" | awk '$4 ~ /^classes[0-9]*\.dex$/ { s += $1 } END { print s + 0 }')
          echo "Template dex: $dex bytes"
          test "$dex" -lt 4000000
          if unzip -Z1 "$apk" | grep -E '^(io/|kotlin/|DebugProbesKt\.bin|kotlin-tooling-metadata\.json)'; then
            echo "IDE-only files in the runtime template"; exit 1
          fi

      # Signed with the release key (RELEASE_* secrets), so it installs over a published release.
      # Pull requests from forks get no secrets and upload an unsigned APK.
      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: .github/scripts/sign-apk.sh "$(ls app/build/outputs/apk/release/*.apk | head -1)"

      - uses: actions/upload-artifact@v4
        with:
          name: nativeforge-release-apk
          path: dist/
          if-no-files-found: error

  # Compiles and links the full-screen examples with the NDK against the bundled libraries, the
  # way the phone builds them (see .github/scripts/compile-examples.py). No Gradle needed.
  examples:
    name: Examples compile (NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install the NDK used by the app
        run: |
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          if [ ! -x "$ndk/ndk-build" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Compile the examples
        run: python3 .github/scripts/compile-examples.py

  # Installs bundled libraries and the Termux toolchain with the APK above on an emulator, then
  # builds and runs a C program with that clang (see .github/scripts/install-smoke.sh). Catches
  # what unit tests cannot: R8 removing code the installer needs, assets missing from the APK,
  # or a change on Termux's side.
  install-smoke:
    name: Package install (emulator)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nativeforge-release-apk
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install packages on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: .github/scripts/install-smoke.sh "$(ls dist/*.apk | head -1)"

name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: these jobs only build and upload artifacts.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      # Every exported app carries the runtime template: keep it shrunk and free of IDE files.
      - name: Check the runtime template size
        run: |
          apk=$(ls runtime-template/build/outputs/apk/release/*.apk)
          unzip -l "$apk"
          dex=$(unzip -l "$apk" | awk '$4 ~ /^classes[0-9]*\.dex$/ { s += $1 } END { print s + 0 }')
          echo "Template dex: $dex bytes"
          test "$dex" -lt 4000000
          if unzip -Z1 "$apk" | grep -E '^(io/|kotlin/|DebugProbesKt\.bin|kotlin-tooling-metadata\.json)'; then
            echo "IDE-only files in the runtime template"; exit 1
          fi

      # Signed with the release key (RELEASE_* secrets), so it installs over a published release.
      # Pull requests from forks get no secrets and upload an unsigned APK.
      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: .github/scripts/sign-apk.sh "$(ls app/build/outputs/apk/release/*.apk | head -1)"

      - uses: actions/upload-artifact@v4
        with:
          name: nativeforge-release-apk
          path: dist/
          if-no-files-found: error

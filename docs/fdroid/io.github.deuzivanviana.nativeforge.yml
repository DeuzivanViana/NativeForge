# Draft recipe for fdroiddata (metadata/io.github.deuzivanviana.nativeforge.yml).
# Test it in a clone of https://gitlab.com/fdroid/fdroiddata with:
#   fdroid readmeta && fdroid rewritemeta io.github.deuzivanviana.nativeforge
#   fdroid lint io.github.deuzivanviana.nativeforge
#   fdroid build -v -l io.github.deuzivanviana.nativeforge
Categories:
  - Development
License: GPL-3.0-or-later
AuthorName: Deuzivan
SourceCode: https://github.com/DeuzivanViana/NativeForge
IssueTracker: https://github.com/DeuzivanViana/NativeForge/issues
Changelog: https://github.com/DeuzivanViana/NativeForge/blob/HEAD/docs/ROADMAP.md

AutoName: NativeForge

RepoType: git
Repo: https://github.com/DeuzivanViana/NativeForge.git

Builds:
  - versionName: 0.7.2
    versionCode: 14
    commit: v0.7.2
    timeout: 14400
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends curl git make python3 xz-utils
    gradle:
      - yes
    # The bundled Android libraries are rebuilt from source (pinned upstream
    # tarballs, checked against packages/sources.sha256) instead of using the
    # prebuilt archives in the repository. `rm` runs before `prebuild`
    # (`scandelete` runs after it and would hit the rebuilt archives), and the
    # work directory is removed so the scanner does not see build outputs.
    rm:
      - app/src/main/assets/packages
    prebuild:
      - sdkmanager 'cmake;3.22.1'
      - ANDROID_HOME=$$SDK$$ ANDROID_NDK_HOME=$$NDK$$ ../packages/build-android-libs.sh
      - rm -rf ../build/android-libs
    ndk: r27c

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.7.2
CurrentVersionCode: 14
